# Escaneo y actualizacion automatica de dependencias.
# Dependabot abre PRs hacia develop; el pipeline CI/CD los valida antes del merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencias-menores:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /db]
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
