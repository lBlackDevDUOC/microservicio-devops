# EJEMPLO: no se incluye en kustomization.yaml ni se usa en el pipeline.
# El pipeline crea el Secret con contrasenas aleatorias en cada ejecucion:
#   kubectl create secret generic mysql-secret -n tienda \
#     --from-literal=MYSQL_ROOT_PASSWORD=... \
#     --from-literal=MYSQL_USER=... \
#     --from-literal=MYSQL_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: tienda
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: cambiar-root
  MYSQL_USER: alumno
  MYSQL_PASSWORD: cambiar-password
