# Punto de entrada publico. En EKS el AWS Load Balancer Controller crea un NLB;
# en el cluster kind del pipeline se accede con kubectl port-forward.
apiVersion: v1
kind: Service
metadata:
  name: tienda-frontend
  namespace: tienda
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: tienda-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
