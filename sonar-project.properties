# Configuracion de SonarCloud (verificar projectKey y organization en sonarcloud.io)
sonar.projectKey=lBlackDevDUOC_microservicio-devops
sonar.organization=lblackdevduoc
sonar.projectName=tienda-perritos

sonar.sources=backend/src,backend/server.js,frontend
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/coverage/**,**/reports/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# El frontend estatico y el punto de entrada no tienen pruebas unitarias
sonar.coverage.exclusions=frontend/**,backend/server.js

# El job falla si el Quality Gate no se cumple (bloquea build y despliegue)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
